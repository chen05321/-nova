<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova 超体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#d4d4d4;min-height:100vh;display:flex;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:6px 10px;color:#ccc;outline:none}
input:focus{border-color:#555}

/* Sidebar */
#side{width:52px;min-width:52px;background:#111;height:100vh;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-right:1px solid #1a1a1a}
#side .sic{width:40px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#666;font-size:11px;cursor:pointer;position:relative;margin:1px 0}
#side .sic:hover{background:rgba(255,255,255,0.04);color:#ccc}
#side .sic.act{color:#00bb7f;background:rgba(0,187,127,0.06)}
.ssec{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center}

/* Dropdown */
.drop{display:none;position:fixed;width:400px;max-height:75vh;background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:6px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,0.4);flex-direction:column}
.drop.show{display:flex}
.drop.show{display:block}
.di{padding:6px 10px;border-radius:4px;font-size:12px;color:#999;cursor:pointer;display:flex;align-items:center;gap:6px}
.di:hover{background:rgba(255,255,255,0.04);color:#ccc}
.di.act{color:#00bb7f}
.di .b2{margin-left:auto;font-size:9px;color:#555}
.dh{font-size:9px;color:#475569;padding:4px 10px;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.di2{padding:4px 10px;font-size:11px;color:#777;cursor:pointer;border-radius:3px}
.di2:hover{background:rgba(255,255,255,0.04);color:#ccc}
.di2.act{color:#00bb7f}
.inp-d{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:5px 8px;color:#ccc;font-size:11px;outline:none;width:100%}
.inp-d:focus{border-color:#555}
.btn-d{display:inline-block;padding:3px 8px;border-radius:3px;border:1px solid #2a2a2a;color:#999;font-size:11px;cursor:pointer;background:transparent}
.btn-d:hover{border-color:#444;color:#ccc}
.btn-d.act{color:#00bb7f;border-color:#00bb7f}
.it-d{padding:4px 0;font-size:11px;color:#999;display:flex;align-items:center;gap:4px;border-bottom:1px solid #1a1a1a}
.it-d .x{margin-left:auto;cursor:pointer;color:#ef4444;font-size:9px;opacity:0.4}
.it-d .x:hover{opacity:1}

/* Main */
#main{flex:1;padding:24px 32px 12px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.main-wrap{max-width:1200px;margin:0 auto;width:100%;flex-shrink:1;overflow-y:auto;min-height:100px}
.main-chat{flex:1 1 300px;min-height:250px;display:flex;flex-direction:column}
.main-chat .chat-box{background:#131313;border:1px solid #1e1e1e;border-radius:8px;padding:14px;display:flex;flex-direction:column;flex:1;min-height:0}
.chat-messages{flex:1;overflow-y:auto;font-size:14px;color:#999;padding:6px 0;line-height:1.6}
.chat-messages div{padding:8px 10px}
.chat-input-row{display:flex;gap:8px;border-top:1px solid #1a1a1a;padding-top:10px;margin-top:10px;flex-shrink:0}
.chat-input-row input{font-size:14px;padding:8px 12px}
.chat-input-row button{padding:8px 16px;font-size:14px}
.page{display:none;max-width:960px;margin:0 auto}
.page.act{display:block}
.p-h{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:16px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.p-h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:16px 0 8px}

/* Dashboard grid */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dg .fw{grid-column:1/3}
.card{background:#131313;border-radius:6px;padding:16px;border:1px solid #1e1e1e}
.ct{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.fill{height:100%;transition:width 0.4s;border-radius:2px}
.sv{font-size:18px;font-weight:500;color:#eee}
.sl{font-size:9px;color:#555;text-transform:uppercase;text-align:center}
.st{text-align:center;min-width:40px}
.badge{padding:1px 6px;border-radius:3px;font-size:9px;font-weight:500}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.si{padding:8px;border-radius:4px;background:#111;border:1px solid #1a1a1a}
.si .nm{font-size:11px;font-weight:500;color:#999}
.si .st2{font-size:10px;color:#666}
.ml{height:2px;background:#1a1a1a;border-radius:1px;overflow:hidden}
.mf{height:100%;transition:width 0.4s}
.tr{display:flex;align-items:center;gap:4px;margin:2px 0}
.tr .lb{font-size:11px;color:#777;width:55px}
.tr .tb{flex:1;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden}
.tr .tf{height:100%;transition:width 0.5s;background:linear-gradient(90deg,#666,#999);border-radius:2px}
.upg{display:inline-block;padding:2px 8px;border-radius:3px;background:#111;color:#888;font-size:11px;margin:2px;border:1px solid #2a2a2a}
.stages{display:flex;align-items:center;gap:2px;margin:4px 0}
.sd{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:500;background:#1a1a1a;color:#555;transition:all 0.3s}
.sd.act{background:#00bb7f;color:#fff}
.sln{width:6px;height:1px;background:#1a1a1a}
.sln.act{background:#00bb7f}

/* Pulse dot */
.pd{display:inline-block;width:16px;height:16px;border-radius:50%;position:relative;vertical-align:middle}
.pd .dt{width:10px;height:10px;border-radius:50%;position:absolute;top:3px;left:3px;transition:all 0.3s}
.pd .rg{width:16px;height:16px;border-radius:50%;position:absolute;animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{transform:scale(0.3);opacity:0.6}100%{transform:scale(1.4);opacity:0}}
.pd.al .dt{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.5)}
.pd.al .rg{border:2px solid #22c55e}
.pd.wn .dt{background:#eab308}
.pd.cr .dt{background:#ef4444}

/* Buttons */
.btn{display:inline-block;padding:5px 12px;border-radius:4px;border:1px solid #2a2a2a;color:#999;font-size:12px;cursor:pointer;transition:all 0.12s;background:transparent}
.btn:hover{border-color:#444;color:#ccc}
.btn.act{border-color:#666;color:#00bb7f;background:rgba(0,187,127,0.08)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.dg{color:#ef4444}
.btn.dg:hover{border-color:#ef4444;color:#ef4444}

/* List items */
.li{padding:6px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1a1a1a;font-size:13px;color:#999}
.li:hover{color:#ccc}
.li .x{margin-left:auto;cursor:pointer;color:#ef4444;opacity:0.4;font-size:11px}
.li .x:hover{opacity:1}

/* Model/Provider cards */
.pc{background:#111;border:1px solid #1a1a1a;border-radius:6px;padding:12px;margin-bottom:8px}
.pc .pn{font-weight:500;font-size:13px;color:#ccc}
.pc .pm{font-size:11px;color:#00bb7f;margin:2px 0}
.pc .pu{font-size:10px;color:#555}
.pc .pk{font-size:10px;color:#555;font-family:monospace}

/* Section tabs */
.stabs{display:flex;gap:0;border-bottom:1px solid #1a1a1a;margin-bottom:16px}
.stab{padding:6px 14px;font-size:12px;color:#666;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.12s}
.stab:hover{color:#999}
.stab.act{color:#00bb7f;border-bottom-color:#00bb7f}

/* Provider list in add flow */
.pv{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #1a1a1a;cursor:pointer;font-size:13px;color:#888}
.pv:hover{color:#ccc}
.pv .pm2{margin-left:auto;font-size:10px;color:#555}
</style>
</head>
<body>

<div id="side">
<div class="sic act" onclick="showDrop('dashboard',event)"><span>仪表盘</span></div>
<div class="sic" onclick="showDrop('sessions',event)"><span>会话</span></div>
<div class="sic" onclick="showDrop('models',event)"><span>模型</span></div>
<div class="sic" onclick="showDrop('profiles',event)"><span>配置</span></div>
<div class="sic" onclick="showDrop('keys',event)"><span>密钥</span></div>
<div class="sic" onclick="showDrop('plugins',event)"><span>插件</span></div>
<div class="sic" onclick="showDrop('skills',event)"><span>技能</span></div>
<div class="sic" onclick="showDrop('logs',event)"><span>日志</span></div>
<div class="sic" onclick="showDrop('analytics',event)"><span>分析</span></div>
<div class="sic" onclick="showDrop('cron',event)"><span>定时</span></div>
<div class="sic" onclick="showDrop('config',event)"><span>设置</span></div>
</div>

<!-- Dropdown container -->
<div id="drop" class="drop"></div>

<div id="main">
<div class="main-wrap">
<div class="dg">
<div class="card fw"><div class="flex" style="justify-content:space-between">
<div class="flex"><span id="hI" class="pd al"><span class="rg"></span><span class="dt"></span></span><span style="font-size:16px;font-weight:600">Nova</span></div>
<div class="flex">
<div class="st"><div class="sv" id="hSt" style="font-size:12px">-</div><div class="sl t" data-zh="阶段" data-en="STAGE">阶段</div></div>
<div class="st"><div class="sv" id="hMo" style="font-size:12px">-</div><div class="sl t" data-zh="模型" data-en="MODEL">模型</div></div>
<div class="st"><div class="sv" id="hRo" style="font-size:12px">-</div><div class="sl t" data-zh="角色" data-en="ROLE">角色</div></div>
<div class="st"><div class="sv" id="hWi">0</div><div class="sl t" data-zh="智慧" data-en="WIS">智慧</div></div>
<div class="st"><div class="sv" id="hBp">-</div><div class="sl t" data-zh="心率" data-en="BPM">心率</div></div>
<div class="st"><div class="sv" id="hBt">0</div><div class="sl t" data-zh="心跳" data-en="BEATS">心跳</div></div>
</div></div></div>
<div class="card"><div class="ct"><span class="t" data-zh="⚡ 能量" data-en="⚡ Energy">⚡ 能量</span> <span id="eBg" class="badge">OK</span></div>
<div class="bar"><div class="fill" id="eBa" style="width:50%"></div></div>
<div class="flex" style="justify-content:space-between;font-size:10px;color:#555;margin-top:2px"><span>0</span><span id="ePc">50%</span><span id="eMx">100</span></div></div>
<div class="card"><div class="ct"><span class="t" data-zh="☠ 废物" data-en="☠ Waste">☠ 废物</span></div>
<div class="bar" style="height:3px"><div class="fill" id="wBa" style="width:0%"></div></div>
<div class="flex" style="justify-content:space-between;font-size:10px;color:#555;margin-top:2px"><span class="t" data-zh="错误" data-en="Err">错误</span> <b id="wEr">0</b><span class="t" data-zh="幻觉" data-en="Hal">幻觉</span> <b id="wHa">0</b><span class="t" data-zh="过时" data-en="Stale">过时</span> <b id="wSt">0</b></div></div>
<div class="card fw"><div class="ct"><span class="t" data-zh="🌱 成长" data-en="🌱 Growth">🌱 成长</span></div><div class="stages" id="sR"></div></div>
<div class="card fw"><div class="ct"><span class="t" data-zh="🧬 系统" data-en="🧬 Systems">🧬 系统</span></div><div class="sg" id="sG"></div></div>
<div class="card" style="display:none"><div class="ct"><span class="t" data-zh="🎭 人格" data-en="🎭 Personality">🎭 人格</span></div><div id="pD"></div></div>
<div class="card" style="display:none"><div class="ct"><span class="t" data-zh="📊 指标" data-en="📊 Metrics">📊 指标</span></div><div id="mD" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:#666"></div></div>
<div class="card fw"><div class="ct"><span class="t" data-zh="⚡ 升级" data-en="⚡ Upgrades">⚡ 升级</span></div><div id="uD"></div></div>
</div>
</div>
<!-- Inline Chat -->
<div class="main-chat"><div class="chat-box" id="chatBox">
<div id="chatConvTabs" style="display:flex;gap:6px;font-size:11px;flex-shrink:0;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid #1a1a1a"></div>
<div class="chat-messages" id="chatMsgs"><div style="padding:20px;text-align:center;color:#555">在下方输入消息开始对话</div></div>
<div class="chat-input-row"><input class="inp-d" id="chatInput" placeholder="输入消息..." style="flex:1"><button class="btn-d" id="chatSend">发送</button></div>
</div></div>
</div>

<!-- Models Page -->

<script>
const ST=Object.freeze(['NEWBORN','CHILD','ADOLESCENT','ADULT','MATURE','ELDER']);
const SN=['Nervous','Musculoskeletal','Endocrine','Respiratory','Digestive','Urinary','Reproductive','Circulatory'];
const SI={Nervous:'🧠',Musculoskeletal:'💪',Endocrine:'🧪',Respiratory:'🌬️',Digestive:'🧬',Urinary:'🚽',Reproductive:'🫄',Circulatory:'❤️'};
const SN_ZH={Nervous:'神经',Musculoskeletal:'运动',Endocrine:'内分泌',Respiratory:'呼吸',Digestive:'消化',Urinary:'泌尿',Reproductive:'生殖',Circulatory:'循环'};
const SN_EN={Nervous:'Nervous',Musculoskeletal:'Musculoskeletal',Endocrine:'Endocrine',Respiratory:'Respiratory',Digestive:'Digestive',Urinary:'Urinary',Reproductive:'Reproductive',Circulatory:'Circulatory'};
function snT(n){var l=localStorage.getItem('nova_lang');return l==='en'?SN_EN[n]:SN_ZH[n]}

function api(p,m){return fetch(p,{method:m||'GET'}).then(r=>r.json())}

function genericDrop(title,content){
 var drop=document.getElementById('drop');
 drop.innerHTML='<div class="di act" style="cursor:default"><span>'+title+'</span></div>'+content;
}

function showDrop(type,event){
 var el=event.currentTarget;
 var rect=el.getBoundingClientRect();
 var drop=document.getElementById('drop');
 
 // Toggle: if clicking same item, close
 if(drop.classList.contains('show')&&drop.dataset.type===type){drop.classList.remove('show');return}
 
 drop.dataset.type=type;
 drop.style.left=Math.min(rect.right+4,window.innerWidth-250)+'px';
 drop.style.top=Math.max(0,rect.top-2)+'px';
 
 document.querySelectorAll('.sic').forEach(function(x){x.classList.remove('act')});
 el.classList.add('act');
 
 if(type==='dashboard'){drop.classList.remove('show');return}
  if(type==='sessions'){toggleChat();return}
 if(type==='profiles')genericDrop('配置','<div style="padding:8px;font-size:11px;color:#555">配置管理功能开发中。</div>');
 if(type==='keys')genericDrop('密钥','<div style="padding:8px;font-size:11px;color:#555">API 密钥在"模型"中添加时配置。<br>点击左侧"模型"管理密钥。</div>');
 if(type==='plugins')genericDrop('插件','<div style="padding:8px;font-size:11px;color:#555">MCP 插件支持，创建 superbody.mcp.json 配置。</div>');
 if(type==='skills')genericDrop('技能','<div style="padding:8px;font-size:11px;color:#555">技能系统开发中。</div>');
 if(type==='cron')genericDrop('定时','<div style="padding:8px;font-size:11px;color:#555">定时任务功能开发中。</div>');
 if(type==='config')genericDrop('设置','<div style="padding:8px;font-size:11px;color:#555;margin-bottom:6px">语言 / 刷新</div>'+
  '<div class="di" onclick="setLang(\'zh\')">🇨🇳 中文</div><div class="di" onclick="setLang(\'en\')">🇺🇸 English</div>'+
  '<div style="display:flex;gap:4px;padding:4px 10px;margin-top:4px"><button class="btn-d act" id="sr1" onclick="sr(1)">1s</button><button class="btn-d" id="sr3" onclick="sr(3)">3s</button><button class="btn-d" id="sr5" onclick="sr(5)">5s</button></div>');
 if(type==='models')renderDropModels();
 if(type==='tasks')renderDropTasks();
 if(type==='health')renderDropHealth();
 if(type==='logs')renderDropLogs();
 if(type==='settings')renderDropSettings();
 drop.classList.add('show');
}

// Close dropdown on click outside
document.addEventListener('click',function(e){
 var drop=document.getElementById('drop');
 if(!drop.contains(e.target)&&!e.target.closest('.sic')){drop.classList.remove('show')}
});

// ═══════════ INLINE CHAT ═══════════

var chatVisible=false;

function toggleChat(){
 loadChatConvs();
 document.getElementById('chatInput').focus();
}

// Load chat history on page load
function loadChatHistory(){
 fetch('/api/chat/history').then(function(r){return r.json()}).then(function(msgs){
  if(!msgs||!msgs.length)return;
  var c=document.getElementById('chatMsgs');
  c.innerHTML='';
  msgs.forEach(function(m){
   var d=document.createElement('div');
   d.style.cssText='padding:6px 8px;color:'+(m.role==='user'?'#ccc':'#e0e6f0')+';border-bottom:1px solid #1a1a1a';
   d.innerHTML='<b>'+(m.role==='user'?'你':'Nova')+':</b> '+m.content;
   c.appendChild(d);
  });
 }).catch(function(){});
}

function loadChatConvs(){
 api('/api/convs').then(function(c){
  var tabs=document.getElementById('chatConvTabs');
  if(c&&c.length)tabs.innerHTML=c.map(function(x){return'<span style="cursor:pointer;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,0.03);'+(x.current?'color:#00bb7f':'color:#666')+'" onclick="api(\'/api/conv/switch?id='+encodeURIComponent(x.id)+'\',\'POST\').then(function(){loadChatConvs()})">'+x.name.substring(0,12)+' ('+x.msgs+')</span>'}).join('');
  else tabs.innerHTML='<span style="color:#555">暂无会话</span>';
 });
}

function sendChat(){
 var input=document.getElementById('chatInput');
 var msg=input.value.trim();
 if(!msg)return;
 input.value='';
 var msgs=document.getElementById('chatMsgs');
 // Remove placeholder
 var placeholder=msgs.querySelector('div[style*=\"text-align:center\"]');
 if(placeholder)placeholder.remove();
 
 var userDiv=document.createElement('div');
 userDiv.style.cssText='padding:6px 8px;color:#ccc;border-bottom:1px solid #1a1a1a';
 userDiv.innerHTML='<b>'+(localStorage.getItem('nova_lang')==='en'?'You':'你')+':</b> '+msg;
 msgs.appendChild(userDiv);
 var respDiv=document.createElement('div');
 respDiv.style.cssText='padding:6px 8px;color:#e0e6f0;border-bottom:1px solid #1a1a1a';
 respDiv.innerHTML='<b>Nova:</b> 思考中...';
 msgs.appendChild(respDiv);
 // Scroll to show newest messages
 msgs.scrollTop=msgs.scrollHeight;
 fetch('/api/chat?msg='+encodeURIComponent(msg)).then(function(r){return r.json()}).then(function(d){
  var text=d.response||'';
  respDiv.innerHTML='<b>Nova:</b> ';
  var i=0;
  var t=setInterval(function(){
   if(i<text.length){i++;respDiv.innerHTML='<b>Nova:</b> '+text.substring(0,i)}
   else{clearInterval(t);loadChatConvs()}
  },20);
 }).catch(function(){respDiv.innerHTML+='(failed)'});
}

// ═══════════ DROPDOWN RENDERERS ═══════════

function renderDropModels(){
 var lang=localStorage.getItem('nova_lang')||'zh';
 var provs=JSON.parse(localStorage.getItem('nova_providers')||'[]');
 var h='<div class="di act" onclick="event.stopPropagation();showProvList()"><span class="t" data-zh="+ 添加" data-en="+ Add">+ 添加</span></div><div class="di" onclick="event.stopPropagation();importOpenCode()"><span>📥 OpenCode</span></div>';
 if(provs.length===0)h+='<div style="padding:8px;font-size:11px;color:#555">'+(lang==='zh'?'暂无':'None')+'</div>';
 else provs.forEach(function(p,i){
  h+='<div class="di" onclick="event.stopPropagation();switchVersion('+i+')"><span>'+p.name+'</span><span style="color:#00bb7f;font-size:10px;margin-left:4px">'+p.model+'</span><span class="b2" onclick="event.stopPropagation();delProv('+i+');renderDropModels()">✕</span></div>'
 });
 document.getElementById('drop').innerHTML=h;}

function switchVersion(i){
 var lang=localStorage.getItem('nova_lang')||'zh';
 var provs=JSON.parse(localStorage.getItem('nova_providers')||'[]');
 var p=provs[i];
 // Find matching vendor presets
 var vendor=null;Object.keys(PROV_GROUPS).forEach(function(cat){Object.keys(PROV_GROUPS[cat].items).forEach(function(k){if(PROV_GROUPS[cat].items[k].name===p.name||PROV_GROUPS[cat].items[k].name.indexOf(p.name.split(' ')[0])>=0)vendor=PROV_GROUPS[cat].items[k]})});
 if(!vendor){// If no presets match, show manual edit
  var h='<div class="dh">'+(lang==='zh'?'切换版本':'Switch version')+'</div>';
  h+='<div style="padding:4px 10px"><input class="inp-d" id="sv_model" value="'+p.model+'" style="margin-bottom:4px">';
  h+='<div style="display:flex;gap:4px"><button class="btn-d" onclick="saveVersion('+i+')">'+(lang==='zh'?'保存':'Save')+'</button><button class="btn-d" onclick="renderDropModels()">'+(lang==='zh'?'取消':'Cancel')+'</button></div></div>';

// ═══════════ LOGS ═══════════

var logFilter='all';
function filterLogs(f){
 logFilter=f;
 document.querySelectorAll('#p-logs .btn.sm').forEach(function(b){b.classList.remove('act')});
 document.getElementById('log'+(f==='all'?'All':f.charAt(0).toUpperCase()+f.slice(1))).classList.add('act');
 renderLogs();
}

function renderLogs(){
 api('/api/logs').then(function(events){
  var h='';
  if(!events||!events.length){h='<div style="color:#555;padding:10px 0">No events</div>';document.getElementById('logList').innerHTML=h;return}
  var filtered=logFilter==='all'?events:events.filter(function(e){return e.event&&e.event.indexOf(logFilter)>=0});
  h=filtered.slice(-100).map(function(e){
   var t=new Date(e.timestamp).toLocaleTimeString();
   var c=e.event&&e.event.indexOf('error')>=0?'#ef4444':e.event&&e.event.indexOf('energy')>=0?'#00bb7f':e.event&&e.event.indexOf('heart')>=0?'#3a93e6':'#666';
   return'<div style="color:'+c+'"><span style="color:#555">'+t+'</span> ['+e.origin+'] '+e.event+'</div>';
  }).join('');
  document.getElementById('logList').innerHTML=h;
 }).catch(function(){});
}

 api('/api/status').then(function(d){

   '<span><span style="color:#555">总心跳</span><br><b style="color:#ccc;font-size:16px">'+d.heart.beat+'</b></span>'+
   '<span><span style="color:#555">总动作</span><br><b style="color:#ccc;font-size:16px">'+d.actions+'</b></span>'+
   '<span><span style="color:#555">智慧值</span><br><b style="color:#ccc;font-size:16px">'+d.wisdom+'</b></span>'+
   '<span><span style="color:#555">能量</span><br><b style="color:#ccc;font-size:16px">'+d.energy.percent+'%</b></span>'+
   '<span><span style="color:#555">废物</span><br><b style="color:#ccc;font-size:16px">'+d.waste.total+'%</b></span>';
  document.getElementById('anLoad').innerHTML=(d.systems||[]).map(function(s){return'<div style="display:flex;justify-content:space-between;margin:3px 0"><span>'+s.name+'</span><span style="color:'+(s.load>70?'#ef4444':s.load>40?'#eab308':'#00bb7f')+'">'+s.load+'%</span></div>'}).join('');
 }).catch(function(){});
 api('/api/logs').then(function(events){
  var h=(events||[]).slice(-30).map(function(e){
   var t=new Date(e.timestamp).toLocaleTimeString();
   return'<div>['+e.origin+'] '+e.event+' <span style="color:#555">'+t+'</span></div>';
  }).join('');
  document.getElementById('anEvents').innerHTML=h||'<div style="color:#555">No events</div>';
 }).catch(function(){});
}
