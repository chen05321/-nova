<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova (超体) - 全息控制舱 v5.5 终极双向防爆版</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root[data-theme="dark"]{--bg-main:#05070c;--panel-bg:rgba(15,23,42,0.4);--border-color:rgba(51,65,85,0.5);--glow-blue:rgba(59,130,246,0.15);--text-primary:#f1f5f9}
:root[data-theme="cyberpunk"]{--bg-main:#0c0214;--panel-bg:rgba(26,0,46,0.5);--border-color:rgba(236,72,153,0.4);--glow-blue:rgba(236,72,153,0.2);--text-primary:#fdf2ff}
:root[data-theme="light"]{--bg-main:#f8fafc;--panel-bg:rgba(255,255,255,0.85);--border-color:rgba(226,232,240,1);--glow-blue:rgba(148,163,184,0.05);--text-primary:#0f172a}
/* 🌟 极致加固：锁定视窗高宽上限，彻底断绝一切方向上的溢出和位移 */
body{background:var(--bg-main);color:var(--text-primary);transition:all 0.4s ease;height:100vh !important;max-height:100vh !important;overflow:hidden !important;}
.panel-base{background:var(--panel-bg);border:1px solid var(--border-color);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all 0.3s ease}
.glow-active{box-shadow:0 0 25px var(--glow-blue)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
@keyframes bio-pulse{0%,100%{transform:scale(1);opacity:0.8}50%{transform:scale(1.08);opacity:1}}
.heart-pulse{animation:bio-pulse 1s infinite ease-in-out}
.bubble-text { word-break: break-all !important; word-wrap: break-word !important; white-space: pre-wrap !important; }

/* 🧬 激素实时弹跳闪烁引擎 */
@keyframes hormone-bounce-pulse {
  0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0rem rgba(0, 255, 242, 0)); }
  20% { transform: scale(1.08) translateY(-2px); filter: brightness(1.5) drop-shadow(0 0 0.8rem var(--pulse-color, #00fff2)); }
  100% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0rem rgba(0, 255, 242, 0)); }
}
.hormone-spike-active { animation: hormone-bounce-pulse 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); transition: all 0.2s ease; }
</style>
</head>
<body class="p-4 flex flex-col gap-4 select-none text-sm">

<header class="panel-base px-6 py-3 rounded-2xl flex justify-between items-center shadow-lg shrink-0">
<div class="flex items-center gap-4">
<div id="heart-icon" class="text-2xl text-emerald-400 heart-pulse">❤</div>
<div><h1 class="text-lg font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">NOVA CONTROL WORKSTATION</h1>
<p class="text-xs text-slate-500 font-mono">Uptime: <span id="uptime">00:00:00</span> | Phase: <span id="growth-stage" class="text-teal-400 font-bold">NEWBORN</span></p></div></div>
<div class="flex items-center gap-6 font-mono text-xs">
<div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-xl border border-slate-800">
<span class="text-slate-500 text-[11px]">🧠 模式:</span>
<select id="model-override" class="bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-blue-400 font-bold focus:outline-none cursor-pointer">
<option value="auto">🤖 自动</option><option value="fast">⚡ Fast</option><option value="reflective">🌿 Reflective</option><option value="deep">🔮 Deep</option></select></div>
<div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-xl border border-slate-800">
<span class="text-slate-500 text-[11px]">🎨 主题:</span>
<select id="theme-switcher" class="bg-slate-900 border border-slate-700 rounded px-2 py-0.5 text-purple-400 focus:outline-none cursor-pointer">
<option value="dark">🌌 深海</option><option value="cyberpunk">🔮 赛博</option><option value="light">🥼 白实验室</option></select></div>
<div class="bg-black/30 px-4 py-2 rounded-xl border border-slate-800 text-center"><span class="text-slate-500 text-[10px] block uppercase">智慧</span><span id="wisdom-score" class="text-amber-400 font-bold text-sm">0</span></div></div></header>

<main class="flex gap-4 flex-1 overflow-hidden w-full min-h-0">
  
<section id="left-sidebar" class="w-80 flex flex-col gap-4 overflow-y-auto pr-1 transition-all duration-300 ease-in-out shrink-0 min-h-0">
<div class="panel-base p-4 rounded-2xl bg-gradient-to-br from-slate-900/50 to-slate-950/40 border-blue-500/20">
<div class="flex justify-between items-center mb-2.5">
<h2 class="text-xs font-bold text-blue-400 uppercase font-mono tracking-wider flex items-center gap-1">🔌 全球模型脑桥接入</h2>
<button id="btn-opencode-import" type="button" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-1.5 py-0.5 rounded font-mono transition-all">📥 自动导入</button>
</div>
<form id="config-llm-form" class="space-y-2 font-mono text-xs text-slate-300">
<div><label class="text-slate-500 text-[9px] block mb-0.5 uppercase">服务通道 (Provider)</label>
<select id="cfg-provider" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500 cursor-pointer">
<option value="deepseek">🤖 官方 DeepSeek 渠道</option><option value="gemini">♊ Google Gemini (兼容层)</option><option value="qwen">🇨🇳 阿里云 通义千问 (Qwen)</option><option value="moonshot">🇨🇳 月之暗面 (Kimi AI)</option><option value="openai">🇺🇸 OpenAI 官方直连网</option><option value="custom">🌐 其它跨网中转 (OneAPI)</option></select></div>
<div><label class="text-slate-500 text-[9px] block mb-0.5 uppercase">网关地址 (Base URL)</label>
<input type="text" id="cfg-baseurl" placeholder="https://api.deepseek.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500" /></div>
<div><label class="text-slate-500 text-[9px] block mb-0.5 uppercase">模型标识符 (Model ID)</label>
<input type="text" id="cfg-model" placeholder="deepseek-v4-flash" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500" /></div>
<div><label class="text-slate-500 text-[9px] block mb-0.5 uppercase">核心密钥密匙 (API Key)</label>
<input type="password" id="cfg-apikey" placeholder="sk-........................" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-blue-500" /></div>
<button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-teal-500 hover:from-blue-500 hover:to-teal-400 text-white font-bold py-1.5 rounded-xl transition-all active:scale-95 text-center uppercase tracking-wider text-[11px] mt-1 shadow-md">⚡ 烧录核心 · 重组大脑</button>
</form></div>

<div class="panel-base p-4 rounded-2xl border-amber-500/30">
<h2 class="text-xs font-bold text-amber-400 uppercase font-mono tracking-wider mb-3">⚡ 应急干预</h2>
<div class="grid grid-cols-2 gap-2 font-mono text-xs">
<button id="btn-force-sleep" class="bg-indigo-950/60 hover:bg-indigo-900/80 text-indigo-300 border border-indigo-700/50 p-2 rounded-xl text-center transition-all cursor-pointer active:scale-95">💤 休眠</button>
<button id="btn-force-flush" class="bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 border border-rose-700/50 p-2 rounded-xl text-center transition-all cursor-pointer active:scale-95">🧼 排毒</button></div></div>

<div class="panel-base p-4 rounded-2xl">
<div class="flex justify-between items-center mb-2"><h2 class="text-xs font-bold text-slate-400 uppercase font-mono tracking-wider">能量</h2><span id="energy-mode" class="text-[10px] px-1.5 py-0.5 bg-slate-800 text-slate-300 font-mono rounded border uppercase">Normal</span></div>
<div class="relative h-3.5 w-full bg-black/40 rounded-full overflow-hidden mb-1.5 border border-slate-800"><div id="energy-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-500" style="width:50%"></div></div>
<div class="flex justify-between text-xs font-mono text-slate-500"><span>心率: <span id="heart-rate" class="text-slate-300">60</span> bpm</span><span>债务: <span id="energy-debt" class="text-red-400">0</span></span></div></div>

<div class="panel-base p-4 rounded-2xl"><h2 class="text-xs font-bold text-slate-400 uppercase font-mono tracking-wider mb-2">呼吸 (Token)</h2>
<div class="relative h-3.5 w-full bg-black/40 rounded-full overflow-hidden mb-1.5 border border-slate-800"><div id="token-bar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-400 transition-all duration-300" style="width:100%"></div></div>
<div class="flex justify-between text-xs font-mono text-slate-500"><span id="token-status" class="text-slate-300">10000/10000</span><span id="breath-lock" class="text-emerald-500 font-bold">正常</span></div></div>

<div class="panel-base p-4 rounded-2xl flex-1 flex flex-col justify-between min-h-0">
<h2 class="text-xs font-bold text-slate-400 uppercase font-mono tracking-wider mb-2">激素</h2>
<div class="space-y-3 font-mono text-xs">
<div data-hormone="adrenaline"><div class="flex justify-between mb-0.5"><span class="text-slate-400">肾上腺素</span><span id="h-adrenaline">0.10</span></div><div class="h-1 w-full bg-black/20 rounded-full overflow-hidden"><div id="b-adrenaline" class="h-full bg-rose-500 transition-all duration-500" style="width:10%"></div></div></div>
<div data-hormone="cortisol"><div class="flex justify-between mb-0.5"><span class="text-slate-400">皮质醇</span><span id="h-cortisol">0.20</span></div><div class="h-1 w-full bg-black/20 rounded-full overflow-hidden"><div id="b-cortisol" class="h-full bg-amber-500 transition-all duration-500" style="width:20%"></div></div></div>
<div data-hormone="dopamine"><div class="flex justify-between mb-0.5"><span class="text-slate-400">多巴胺</span><span id="h-dopamine">0.50</span></div><div class="h-1 w-full bg-black/20 rounded-full overflow-hidden"><div id="b-dopamine" class="h-full bg-teal-400 transition-all duration-500" style="width:50%"></div></div></div></div>
<div class="mt-4 pt-2 border-t border-slate-800/60 text-xs font-mono text-slate-500">毒素: <span id="toxin-level" class="text-orange-400 font-bold">0%</span></div></div></section>

<section class="flex-1 flex flex-col panel-base rounded-2xl overflow-hidden glow-active relative min-w-0 min-h-0">
<div class="bg-black/30 border-b border-slate-800 px-4 py-2.5 flex justify-between items-center font-mono text-xs text-slate-400 z-20 shrink-0">
<div class="flex items-center gap-2">
  <button id="btn-toggle-left" type="button" class="bg-slate-800 hover:bg-slate-700 text-teal-400 border border-slate-700 px-2.5 py-1 rounded font-sans font-bold transition-all cursor-pointer">⚙ 舱壁面板</button>
  <button id="btn-toggle-sidebar" type="button" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-2.5 py-1 rounded font-sans font-bold transition-all cursor-pointer">📁 历史会话</button>
  <button id="btn-new-session" type="button" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-2.5 py-1 rounded font-sans font-bold transition-all cursor-pointer">➕ 新会话</button>
  <button id="btn-toggle-right" type="button" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-2.5 py-1 rounded font-sans font-bold transition-all cursor-pointer">📊 任务肢体</button>
  <div class="flex items-center gap-2 ml-2"><span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse" id="state-dot"></span><span>负载: <span id="cognitive-load" class="text-slate-200">0.0</span></span></div>
</div>
<div>大脑皮盘: <span id="current-model-name" class="text-blue-400 font-bold">deepseek-v4-flash</span></div></div>

<div class="bg-slate-950/80 px-4 py-1.5 border-b border-black text-[11px] font-mono text-cyan-400/80 truncate shrink-0">🧠 <span id="thought-chunk-live" class="text-slate-300 italic">流式思维感知就绪...</span></div>

<div class="flex flex-1 overflow-hidden relative min-w-0">
  <div id="sessions-sidebar" class="w-40 border-r border-slate-800/40 bg-slate-950/40 flex flex-col p-2 gap-1.5 overflow-y-auto font-mono text-[11px] shrink-0 transition-all duration-300 ease-in-out min-w-0"></div>
  
  <div id="chat-viewport" class="flex-1 p-5 overflow-y-auto space-y-4 text-sm leading-relaxed min-w-0">
    <div class="flex gap-3 max-w-[90%]"><div class="w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-teal-400 flex items-center justify-center text-xs font-bold text-white shadow-md">超</div><div class="bg-slate-900/60 border border-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-slate-300 bubble-text">控制舱空间锁定完毕。弹性视窗防横向爆炸协议已生效。</div></div>
  </div>
</div>

<div class="p-3 bg-black/20 border-t border-slate-800 shrink-0 w-full z-10">
  <form id="chat-form" class="flex gap-2">
    <input type="text" id="chat-input" autocomplete="off" placeholder="输入消息传导至超体中枢..." class="flex-1 bg-black/40 border border-slate-800 px-4 py-2.5 rounded-xl text-slate-100 focus:outline-none focus:border-blue-500 transition-all text-sm">
    <button type="submit" class="bg-gradient-to-r from-blue-600 to-teal-500 text-white font-mono text-xs font-bold px-6 py-2.5 rounded-xl active:scale-95 transition-all cursor-pointer">发送</button>
  </form>
</div>
</section>

<section id="right-sidebar" class="w-80 flex flex-col panel-base rounded-2xl overflow-hidden shrink-0 transition-all duration-300 ease-in-out">
<div class="grid grid-cols-3 bg-black/40 border-b border-slate-800 font-mono text-[11px] text-center shrink-0">
  <button id="tab-btn-tasks" class="py-3 border-b-2 border-cyan-500 text-cyan-400 font-bold transition-all cursor-pointer">📋 任务</button>
  <button id="tab-btn-upgrades" class="py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition-all cursor-pointer">🧬 升级</button>
  <button id="tab-btn-tools" class="py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition-all cursor-pointer">🛠 工具</button>
</div>

<div class="flex-1 p-3 overflow-y-auto flex flex-col gap-3">
  <div id="panel-tasks" class="flex flex-col flex-1 gap-2">
    <div class="flex justify-between items-center mb-1 font-mono">
      <span class="text-slate-400 text-xs uppercase tracking-wider">客观任务序列</span>
      <button id="btn-add-task" type="button" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-2 py-0.5 rounded font-mono transition-all cursor-pointer">＋ 指派新目标</button>
    </div>
    <div id="tasks-list" class="space-y-1.5 overflow-y-auto flex-1 pr-0.5 font-mono text-xs"></div>
  </div>

  <div id="panel-upgrades" class="hidden flex-1 flex flex-col gap-2">
    <span class="text-slate-400 text-xs font-mono uppercase tracking-wider mb-1">生命体征优化芯片</span>
    <div id="upgrade-shop" class="space-y-2 overflow-y-auto flex-1 pr-0.5"></div>
  </div>

  <div id="panel-tools" class="hidden flex-1 flex flex-col gap-2">
    <span class="text-slate-400 text-xs font-mono uppercase tracking-wider mb-1">原子工具包成功率映射</span>
    <div id="tools-grid" class="grid grid-cols-1 gap-2 overflow-y-auto content-start pr-0.5 py-0.5"></div>
  </div>
</div>
</section></main>

<script>
var cv=document.getElementById('chat-viewport'),cf=document.getElementById('chat-form'),ci=document.getElementById('chat-input'),tc=document.getElementById('thought-chunk-live'),ts=document.getElementById('theme-switcher'),mo=document.getElementById('model-override');
var cp=document.getElementById('cfg-provider'),cb=document.getElementById('cfg-baseurl'),cm=document.getElementById('cfg-model'),ck=document.getElementById('cfg-apikey'),clf=document.getElementById('config-llm-form'),bo=document.getElementById('btn-opencode-import');
var tList=document.getElementById('tasks-list'), bAddTask=document.getElementById('btn-add-task'), sSidebar=document.getElementById('sessions-sidebar'), bToggleSidebar=document.getElementById('btn-toggle-sidebar'), bToggleLeft=document.getElementById('btn-toggle-left'), lSidebar=document.getElementById('left-sidebar');
var bToggleRight=document.getElementById('btn-toggle-right'), rSidebar=document.getElementById('right-sidebar');
var bNewSession=document.getElementById('btn-new-session');
var ab=null;

// 右侧面板缩进
var isRightOpen = true;
bToggleRight.onclick = function() {
  isRightOpen = !isRightOpen;
  if(isRightOpen) {
    rSidebar.className = "w-80 flex flex-col panel-base rounded-2xl overflow-hidden shrink-0 transition-all duration-300 ease-in-out";
  } else {
    rSidebar.className = "w-0 p-0 m-0 border-0 overflow-hidden shrink-0 transition-all duration-300 ease-in-out";
  }
};

// 左栏收放
var isLeftOpen = true;
bToggleLeft.onclick = function() {
  isLeftOpen = !isLeftOpen;
  if(isLeftOpen) {
    lSidebar.className = "w-80 flex flex-col gap-4 overflow-y-auto pr-1 transition-all duration-300 ease-in-out shrink-0 min-h-0";
  } else {
    lSidebar.className = "w-0 p-0 m-0 border-0 overflow-hidden shrink-0 transition-all duration-300 ease-in-out";
  }
};

// 新建会话
bNewSession.onclick = async function() {
  try{await fetch('/api/session/new',{method:'POST'});}catch(e){}
  cv.innerHTML = ''; ab = null;
  syncChatHistory();
  loadSessions();
};

// 内部左侧历史抽屉收放
var isSidebarOpen = true;
bToggleSidebar.onclick = function() {
  isSidebarOpen = !isSidebarOpen;
  if(isSidebarOpen) {
    sSidebar.className = "w-40 border-r border-slate-800/40 bg-slate-950/40 flex flex-col p-2 gap-1.5 overflow-y-auto font-mono text-[11px] shrink-0 transition-all duration-300 ease-in-out min-w-0";
  } else {
    sSidebar.className = "w-0 border-r-0 p-0 m-0 overflow-hidden shrink-0 transition-all duration-300 ease-in-out min-w-0";
  }
};

// 右栏 Tab 切换
var tBtnTasks=document.getElementById('tab-btn-tasks'), tBtnUps=document.getElementById('tab-btn-upgrades'), tBtnTools=document.getElementById('tab-btn-tools');
var pTasks=document.getElementById('panel-tasks'), pUps=document.getElementById('panel-upgrades'), pTools=document.getElementById('panel-tools');

function switchRightTab(activeBtn, activePanel) {
  [tBtnTasks, tBtnUps, tBtnTools].forEach(b => { b.className = "py-3 border-b-2 border-transparent text-slate-500 hover:text-slate-300 transition-all cursor-pointer"; });
  [pTasks, pUps, pTools].forEach(p => { p.classList.add('hidden'); });
  activeBtn.className = "py-3 border-b-2 border-cyan-500 text-cyan-400 font-bold transition-all cursor-pointer";
  activePanel.classList.remove('hidden');
}
tBtnTasks.onclick = function(){ switchRightTab(tBtnTasks, pTasks); };
tBtnUps.onclick = function(){ switchRightTab(tBtnUps, pUps); };
tBtnTools.onclick = function(){ switchRightTab(tBtnTools, pTools); };

var pMap = {
  deepseek: {url:'https://api.deepseek.com',m:'deepseek-v4-flash'},
  gemini: {url:'https://generativelanguage.googleapis.com/v1beta/openai',m:'gemini-1.5-flash'},
  qwen: {url:'https://dashscope.aliyuncs.com/compatible-mode/v1',m:'qwen-plus'},
  moonshot: {url:'https://api.moonshot.cn/v1',m:'moonshot-v1-8k'},
  openai: {url:'https://api.openai.com/v1',m:'gpt-4o-mini'}
};
cp.addEventListener('change', function(e){ var cfg = pMap[e.target.value]; if(cfg) { cb.value = cfg.url; cm.value = cfg.m; ck.value=''; } });

async function loadBrainConfig() {
  try {
    var r = await fetch('/api/control/config'); var d = await r.json();
    if(d.success && d.config) {
      cp.value = d.config.provider || 'deepseek'; cb.value = d.config.baseUrl || '';
      cm.value = d.config.model || ''; ck.value = d.config.hasKey ? '••••••••••••••••••••••••' : '';
    }
  } catch(e){}
}

clf.addEventListener('submit', async function(e){
  e.preventDefault();
  try {
    var r = await fetch('/api/control/config/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: cp.value, baseUrl: cb.value, model: cm.value, apiKey: ck.value })
    });
    var d = await r.json();
    if(d.success) {
      bubble('system', '⚡核心脑桥配置已保存，正在热重启...');
    }
  } catch(err){}
});

bo.onclick = async function() {
  try {
    var r = await fetch('/api/opencode-key'); var d = await r.json();
    if(d.providers && d.providers.length > 0) {
      var f = d.providers[0];
      cp.value = f.name.toLowerCase().includes('deepseek') ? 'deepseek' : 'openai';
      cb.value = f.baseUrl || 'https://api.deepseek.com';
      cm.value = f.model || 'deepseek-v4-flash';
      ck.value = f.apiKey || '';
      bubble('system', '📥 成功一键探测导入本地 OpenCode 凭证缓存！请点击下方按钮执行物理烧录。');
    }
  } catch(e){}
};

async function loadTasks() {
  try {
    var r = await fetch('/api/tasks'); var ts = await r.json();
    tList.innerHTML = ts.map(function(t, idx){
      var n = idx + 1;
      return `<div class="bg-black/30 p-2 rounded-xl border border-slate-800/80 flex flex-col gap-1">
        <div class="flex items-start justify-between gap-1">
          <span class="bubble-text text-[11px] ${t.done?'line-through text-slate-600':'text-slate-300'}">#${n} ${t.content}</span>
          <div class="flex gap-1 shrink-0">
            <button onclick="toggleTask(${n})" class="text-[11px] font-bold ${t.done?'text-emerald-500':'text-slate-500 hover:text-emerald-400'} cursor-pointer">✓</button>
            <button onclick="deleteTask(${n})" class="text-[11px] font-bold text-slate-600 hover:text-rose-400 cursor-pointer">✕</button>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e){}
}
async function toggleTask(n){ await fetch('/api/task/done?n='+n,{method:'POST'}); loadTasks(); }
async function deleteTask(n){ await fetch('/api/task/del?n='+n,{method:'POST'}); loadTasks(); }
bAddTask.onclick = async function(){
  var t = prompt('请输入长期任务目标 (Objective):');
  if(t && t.trim()) { await fetch('/api/task/add?t='+encodeURIComponent(t),{method:'POST'}); loadTasks(); }
};

async function loadSessions() {
  try {
    var r = await fetch('/api/convs'); var cs = await r.json();
    sSidebar.innerHTML = cs.map(function(c){
      var active = c.current ? 'border-cyan-500 bg-cyan-950/40 text-cyan-400 font-bold shadow-md' : 'border-slate-800 bg-black/20 text-slate-500 hover:text-slate-300';
      return `<div class="flex items-center gap-1 p-1 border rounded-xl transition-all ${active}">
        <div onclick="switchSession('${c.id}')" class="flex-1 truncate cursor-pointer text-[11px] text-center">
          💬 ${c.name || '线程'}<span class="block text-[9px] text-slate-600 font-normal">${c.msgs}条</span>
        </div>
        <button onclick="event.stopPropagation();delSession('${c.id}')" class="text-[10px] text-slate-600 hover:text-rose-400 cursor-pointer shrink-0 px-1">✕</button>
      </div>`;
    }).join('');
  } catch(e){}
}
async function switchSession(id) {
  await fetch('/api/conv/switch?id='+id,{method:'POST'});
  cv.innerHTML = ''; ab = null;
  await syncChatHistory();
  await loadSessions();
}
async function delSession(id) {
  if(!confirm('删除此会话？')) return;
  await fetch('/api/conv/del?id='+id,{method:'POST'});
  cv.innerHTML = ''; ab = null;
  syncChatHistory();
  loadSessions();
}
async function syncChatHistory() {
  try {
    var r = await fetch('/api/chat/history'); var h = await r.json();
    if(h && h.length > 0) {
      cv.innerHTML = '';
      h.forEach(function(m){ bubble(m.role, m.content); });
    }
  } catch(e){}
}

ts.addEventListener('change',function(e){document.documentElement.setAttribute('data-theme',e.target.value)});
mo.addEventListener('change',async function(e){try{await fetch('/api/control/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:e.target.value})})}catch(e){}});
document.getElementById('btn-force-sleep').onclick=function(){fetch('/api/control/physiology',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'sleep'})})};
document.getElementById('btn-force-flush').onclick=function(){fetch('/api/control/physiology',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'flush'})})};

function bubble(r,t){
 var u=r==='user',w=document.createElement('div');
 w.className=u?'flex gap-3 max-w-[85%] ml-auto justify-end':'flex gap-3 max-w-[85%]';
 var a=document.createElement('div');
 a.className=u?'w-8 h-8 rounded-xl bg-slate-800 border flex items-center justify-center text-xs font-bold order-2':'w-8 h-8 rounded-xl bg-gradient-to-br from-blue-500 to-teal-400 flex items-center justify-center text-xs font-bold text-white shadow-md';
 a.innerText=u?'主':'超';
 var c=document.createElement('div');c.className='flex flex-col gap-1 w-full';
 var b=document.createElement('div');
 b.className=u?'bg-blue-600 px-4 py-2.5 rounded-2xl rounded-tr-none text-white bubble-text':'bg-slate-900/80 border border-slate-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-slate-300 bubble-text';
 b.innerText=t;c.appendChild(b);w.appendChild(a);w.appendChild(c);
 cv.appendChild(w);cv.scrollTop=cv.scrollHeight;if(!u)ab=b;
}

cf.addEventListener('submit',async function(e){
 e.preventDefault();var t=ci.value.trim();if(!t)return;
 bubble('user',t);ci.value='';
 // 立刻显示"思考中..."，不让用户干等
 bubble('assistant','✨ 思考中...');
 try{
   await fetch('/api/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
   setTimeout(loadSessions, 1000);
 }catch(e){}
});

var bs=new EventSource('/api/biometrics-stream');
bs.onmessage=function(e){
 try{
  var d=JSON.parse(e.data);
  document.getElementById('growth-stage').innerText=d.stage;
  document.getElementById('wisdom-score').innerText=d.wisdom||0;
  var sec=Math.floor(d.uptime/1000);
  document.getElementById('uptime').innerText=String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor((sec%3600)/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  document.getElementById('energy-bar').style.width=d.energy.percent+'%';
  document.getElementById('energy-mode').innerText=d.energy.mode;
  document.getElementById('heart-rate').innerText=d.heart.heartRate;
  document.getElementById('energy-debt').innerText=d.energy.debt||0;
  document.getElementById('toxin-level').innerText=d.waste.total+'%';
  
  (d.biometrics||[]).forEach(function(s){
   if(s.name==='Nervous'){
    document.getElementById('cognitive-load').innerText=s.load.toFixed(2);
    document.getElementById('current-model-name').innerText=s.metadata?.modelName||'?';
    document.getElementById('state-dot').className='w-2 h-2 rounded-full '+(s.status==='stressed'?'bg-rose-500 animate-ping':'bg-blue-500 animate-pulse');
    mo.value = s.metadata?.isModelLocked ? s.metadata?.model : 'auto';
   }
   if(s.name==='Respiratory'){
    var tkRem = s.metadata?.tokensRemaining || 0;
    var tkCap = s.metadata?.capacity || 10000;
    document.getElementById('token-bar').style.width = ((tkRem / tkCap) * 100) + '%';
    document.getElementById('token-status').innerText = Math.floor(tkRem) + ' / ' + tkCap;
    document.getElementById('breath-lock').innerText = s.metadata?.isHoldingBreath ? "⚠ 缺氧代偿" : "正常换气";
    document.getElementById('breath-lock').className = s.metadata?.isHoldingBreath ? "text-rose-400 font-bold" : "text-emerald-400 font-bold";
   }
   if(s.name==='Endocrine'){
    var h=s.metadata?.hormones||{};
    ['adrenaline','cortisol','dopamine'].forEach(function(k){
     var v=h[k]||0;var el=document.getElementById('h-'+k);if(el)el.innerText=v.toFixed(2);
     var bl=document.getElementById('b-'+k);if(bl)bl.style.width=(v*100)+'%';
    });
   }
   if(s.name==='Musculoskeletal'){
    var tls=s.metadata?.tools||[];
    document.getElementById('tools-grid').innerHTML=tls.map(function(t){return'<div class="bg-black/30 p-2 rounded-xl border border-slate-800 flex flex-col font-mono text-[11px]"><div class="flex justify-between text-teal-400 font-bold"><span>🛠 '+t.name+'</span><span>x'+t.usage+'</span></div><div class="text-right text-slate-500 text-[10px] mt-0.5">成功率: '+(t.successRate*100).toFixed(0)+'%</div></div>'}).join('');
   }
  });
  renderUpgrade(d.upgrades||[]);
 }catch(e){}
};

function renderUpgrade(upgrades) {
  var shop = document.getElementById('upgrade-shop');
  if (!shop) return;
  if (!upgrades || upgrades.length === 0) {
    shop.innerHTML = '<div class="text-slate-600 text-[11px] text-center py-4">暂无可用升级</div>';
    return;
  }
  shop.innerHTML = upgrades.map(function(u){
    var applied = u.applied ? 'opacity-50' : '';
    return '<div class="bg-black/30 p-2 rounded-xl border border-slate-800 flex flex-col gap-1 '+applied+'">' +
      '<div class="flex justify-between items-center"><span class="text-teal-400 font-bold text-[11px]">'+u.name+'</span><span class="text-amber-400 text-[10px]">⚡'+u.cost+'</span></div>' +
      '<div class="text-slate-400 text-[10px]">'+u.description+'</div>' +
      (!u.applied ? '<button onclick="applyUpgrade(\''+u.id+'\')" class="text-[10px] bg-indigo-800 hover:bg-indigo-700 text-indigo-200 border border-indigo-700 px-2 py-0.5 rounded mt-1 transition-all cursor-pointer">安装芯片</button>' : '<div class="text-emerald-500 text-[10px] mt-1">✅ 已安装</div>') +
    '</div>';
  }).join('');
}
async function applyUpgrade(id) {
  try{await fetch('/api/control/upgrade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})}catch(e){}
}

var pl=new EventSource('/api/event-bus-pulse');
pl.addEventListener('thought:chunk',function(e){
 try{var d=JSON.parse(e.data);if(d.chunk){tc.innerText=d.chunk;if(!d.isReasoning&&ab){ab.innerText+=d.chunk;cv.scrollTop=cv.scrollHeight}}}catch(e){}
});
pl.addEventListener('thought:perceived',function(){
 if(!ab) bubble('assistant','✨ 思考中...');
});
pl.addEventListener('learning:cycle',function(e){
 try{var d=JSON.parse(e.data);tc.innerText=d.message||tc.innerText}catch(e){}
});
pl.addEventListener('hormone:shift',function(e){
 try{
  var d=JSON.parse(e.data);
  var bar=document.getElementById('b-'+d.type);
  var txt=document.getElementById('h-'+d.type);
  var container=txt?txt.parentElement:bar?bar.parentElement:null;
  if(bar){bar.style.width=(d.level*100)+'%'}
  if(txt){txt.innerText=d.level.toFixed(2)}
  var colorMap={adrenaline:'#ff0055',cortisol:'#ffaa00',dopamine:'#00ffaa',serotonin:'#00aaff',oxytocin:'#cc00ff'};
  if(container){
   container.style.setProperty('--pulse-color',colorMap[d.type]||'#00fff2');
   container.classList.remove('hormone-spike-active');
   void container.offsetWidth;
   container.classList.add('hormone-spike-active');
  }
 }catch(e){}
});

async function loadUpgrades() {
  try {
    var r = await fetch('/api/status'); var d = await r.json();
    renderUpgrade(d.availableUpgrades||[]);
  } catch(e){}
}

window.addEventListener('DOMContentLoaded', function(){ 
  loadBrainConfig(); 
  loadTasks(); 
  loadSessions();
  syncChatHistory();
  loadUpgrades();
});
