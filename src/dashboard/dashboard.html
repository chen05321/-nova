<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA · 神经看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12; --panel:#111120; --border:#1e1e3a;
  --cyan:#00f0ff; --pink:#ff2d95; --green:#00ff88; --yellow:#ffd700;
  --orange:#ff6600; --purple:#b44dff; --red:#ff3355;
  --text:#c0c0d0; --dim:#606080; --glow:0 0 6px;
}
body{background:var(--bg);color:var(--text);font-family:'Courier New',monospace;overflow-x:hidden}
.glow{text-shadow:0 0 8px rgba(0,240,255,0.4)}
/* ── Layout ── */
.app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:52px 160px 1fr;height:100vh;gap:1px;background:var(--border)}
.header{grid-column:1/3;display:flex;align-items:center;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--cyan);gap:12px}
.header .logo{font-size:18px;font-weight:700;color:var(--cyan)}
.header .logo span{color:var(--pink)}
.header .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--cyan);color:#000;font-weight:700}
.header .badge.off{background:var(--dim);color:var(--text)}
.header .status-line{margin-left:auto;font-size:12px;display:flex;gap:16px;align-items:center}
.header .status-line .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.red{background:var(--red);box-shadow:0 0 6px var(--red)}
/* ── Heartbeat Wave ── */
.hb-panel{grid-column:1/3;display:flex;background:var(--panel);padding:0 12px;gap:12px;border-bottom:1px solid var(--border)}
.hb-chart{flex:1;height:158px;position:relative}
.hb-chart svg{width:100%;height:100%}
.hb-stats{width:280px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px;padding:8px 0}
.hb-stats .row{display:flex;justify-content:space-between;align-items:center}
.hb-stats .val{font-weight:700;min-width:50px;text-align:right}
.hb-stats .bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex:1;margin:0 8px}
.hb-stats .bar-fill{height:100%;border-radius:3px;transition:width 0.3s}
.metabar{display:flex;gap:4px;padding:2px 0;align-items:center;font-size:11px}
.metabar .tag{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:2px}
/* ── Main Grid ── */
.main{display:flex;flex-direction:column;overflow-y:auto;padding:8px;gap:8px;background:var(--bg)}
.side{overflow-y:auto;padding:8px;gap:8px;display:flex;flex-direction:column;background:var(--bg)}
/* ── Panels ── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:12px}
.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between}
/* ── Graph ── */
.graph-wrap{height:280px;position:relative;overflow:hidden}
.graph-wrap svg{width:100%;height:100%}
/* ── Chat ── */
.chat-area{display:flex;flex-direction:column;flex:1;min-height:200px}
.chat-msgs{flex:1;overflow-y:auto;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-height:300px}
.chat-msgs .msg{padding:4px 8px;border-radius:4px;line-height:1.4}
.chat-msgs .msg.user{background:rgba(0,240,255,0.08);border-left:2px solid var(--cyan)}
.chat-msgs .msg.nova{background:rgba(255,45,149,0.08);border-left:2px solid var(--pink)}
.chat-msgs .msg.system{background:rgba(0,255,136,0.06);border-left:2px solid var(--green)}
.chat-msgs .msg .sender{font-size:10px;font-weight:700;opacity:0.6}
.chat-input-wrap{display:flex;gap:4px;margin-top:4px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;font-family:inherit;font-size:12px;border-radius:4px;outline:none}
.chat-input:focus{border-color:var(--cyan)}
.chat-send{background:var(--cyan);color:#000;border:none;padding:6px 12px;font-family:inherit;font-weight:700;border-radius:4px;cursor:pointer;font-size:12px}
.chat-send:hover{box-shadow:0 0 10px var(--cyan)}
/* ── Hormones ── */
.hormone-list{display:flex;flex-direction:column;gap:3px}
.hormone-row{display:flex;align-items:center;gap:6px;font-size:11px}
.hormone-row .name{width:70px;font-weight:700;text-align:right}
.hormone-row .bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.hormone-row .bar-fill{height:100%;border-radius:4px;transition:width 0.5s,background 0.5s}
.hormone-row .val{width:32px;text-align:right}
/* ── Attention ── */
.attn-list{display:flex;flex-wrap:wrap;gap:3px}
.attn-tag{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.2)}
/* ── Ticker ── */
.ticker{overflow:hidden;height:20px;position:relative;background:rgba(0,0,0,0.3);border-radius:4px;padding:0 8px;font-size:11px;line-height:20px;white-space:nowrap}
.ticker-inner{animation:tick 30s linear infinite;display:inline-block}
@keyframes tick{0%{transform:translateX(100%)}100%{transform:translateX(-200%)}}
/* ── EKG line ── */
.ekg-line{stroke:var(--cyan);stroke-width:2;fill:none;filter:drop-shadow(0 0 4px var(--cyan))}
.ekg-grid line{stroke:var(--border);stroke-width:0.5}
.ekg-area{fill:url(#ekg-grad);opacity:0.15}
/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* ── Responsive ── */
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto}.side{max-height:400px}}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">◆ <span>NOVA</span></div>
    <div class="badge" id="status-badge">启动中</div>
    <div class="status-line">
      <span><span class="dot green" id="running-dot"></span><span id="running-text">运行中</span></span>
      <span>⚡ <span id="energy-val">50</span>%</span>
      <span>❤ <span id="bpm-val">60</span> BPM</span>
      <span>🧠 <span id="wisdom-val">0</span></span>
      <span>🗑 <span id="waste-val">0</span></span>
      <span id="stage-val">NEWBORN</span>
    </div>
  </div>

  <!-- Heartbeat Wave + Hormone Mini -->
  <div class="hb-panel">
    <div class="hb-chart"><canvas id="ekg-canvas" width="800" height="160" style="width:100%;height:160px"></canvas></div>
    <div class="hb-stats">
      <div class="row"><span>❤ 心率</span><div class="bar"><div class="bar-fill" id="bpm-bar" style="width:60%;background:var(--cyan)"></div></div><span class="val" id="bpm-val2">60</span></div>
      <div class="row"><span>⚡ 能量</span><div class="bar"><div class="bar-fill" id="energy-bar" style="width:50%;background:var(--green)"></div></div><span class="val" id="energy-val2">50</span></div>
      <div class="row"><span>🗑 废物</span><div class="bar"><div class="bar-fill" id="waste-bar" style="width:0%;background:var(--orange)"></div></div><span class="val" id="waste-val2">0</span></div>
      <div class="row"><span>🌱 阶段</span><span class="val" id="stage-val2" style="color:var(--cyan)">NEWBORN</span></div>
      <div class="row"><span>🧬 智慧</span><span class="val" id="wisdom-val2" style="color:var(--purple)">0</span></div>
      <div class="ticker" id="ticker"><span class="ticker-inner" id="ticker-text">◆ NOVA 超体系统监控 v2.0 ◆ 准备就绪</span></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Ticker row -->
    <div class="panel" style="padding:4px 8px">
      <div class="ticker" style="height:18px;line-height:18px;font-size:10px;background:transparent">
        <span class="ticker-inner" id="ticker-main" style="animation-duration:20s">等待系统数据...</span>
      </div>
    </div>

    <!-- System Graph -->
    <div class="panel">
      <div class="panel-title"><span>🕸 系统关联图</span><span id="graph-info">系统: 0 | 链接: 0</span></div>
      <div class="graph-wrap"><svg id="graph-svg" viewBox="0 0 740 280"></svg></div>
    </div>

    <!-- Chat -->
    <div class="panel chat-area">
      <div class="panel-title"><span>💬 神经对话</span><span style="color:var(--dim);font-size:10px">Enter 发送</span></div>
      <div class="chat-msgs" id="chat-msgs">
        <div class="msg system"><div class="sender">◆ SYSTEM</div>NOVA 生物系统已就绪，输入消息开始对话。</div>
      </div>
      <div class="chat-input-wrap">
        <input class="chat-input" id="chat-input" placeholder="输入消息..." autofocus>
        <button class="chat-send" id="chat-send">发送</button>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="side">
    <!-- Hormones -->
    <div class="panel">
      <div class="panel-title"><span>🧪 激素水平</span><span id="hormone-ts" style="font-size:10px;color:var(--dim)">—</span></div>
      <div class="hormone-list" id="hormone-list">
        <div class="hormone-row"><span class="name">肾上腺素</span><div class="bar"><div class="bar-fill" style="width:10%;background:var(--red)"></div></div><span class="val" id="h-adrenaline">0.1</span></div>
        <div class="hormone-row"><span class="name">皮质醇</span><div class="bar"><div class="bar-fill" style="width:20%;background:var(--orange)"></div></div><span class="val" id="h-cortisol">0.2</span></div>
        <div class="hormone-row"><span class="name">多巴胺</span><div class="bar"><div class="bar-fill" style="width:40%;background:var(--yellow)"></div></div><span class="val" id="h-dopamine">0.4</span></div>
        <div class="hormone-row"><span class="name">血清素</span><div class="bar"><div class="bar-fill" style="width:50%;background:var(--green)"></div></div><span class="val" id="h-serotonin">0.5</span></div>
        <div class="hormone-row"><span class="name">催产素</span><div class="bar"><div class="bar-fill" style="width:30%;background:var(--purple)"></div></div><span class="val" id="h-oxytocin">0.3</span></div>
      </div>
    </div>

    <!-- Attention -->
    <div class="panel">
      <div class="panel-title"><span>🎯 注意力分配</span></div>
      <div class="attn-list" id="attn-list"></div>
    </div>

    <!-- Knowledge Stream -->
    <div class="panel" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="panel-title"><span>📋 知识流</span><span id="kflow-count">0</span></div>
      <div id="kflow-list" style="flex:1;overflow-y:auto;font-size:11px;display:flex;flex-direction:column;gap:3px"></div>
    </div>
  </div>
</div>

<script>
const API = '';
const HORMONE_COLORS = {adrenaline:'var(--red)',cortisol:'var(--orange)',dopamine:'var(--yellow)',serotonin:'var(--green)',oxytocin:'var(--purple)'};
const HORMONE_NAMES = {adrenaline:'肾上腺素',cortisol:'皮质醇',dopamine:'多巴胺',serotonin:'血清素',oxytocin:'催产素'};
const SYSTEM_COLORS = {
  NervousSystem:'#00f0ff',ReproductiveSystem:'#ff2d95',KnowledgeCore:'#b44dff',
  SelfLearningSystem:'#ffd700',DigestiveSystem:'#00ff88',UrinarySystem:'#ff6600',
  ForagingSystem:'#8892b0',ImmuneSystem:'#ff3355',MusculoskeletalSystem:'#66ccff',
  EndocrineSystem:'#ff66cc',RespiratorySystem:'#66ffcc'
};

// ── EKG Canvas ──
const EKG_POINTS = 400;
let ekgData = [];
// 预生成 PQRST 波型 (1个完整心跳周期, 60帧)
const PQRST = [];
for(let i=0;i<60;i++){
  const t = i/60;
  let v;
  if(t < 0.02) v = 0;                              // 基线
  else if(t < 0.10) v = -0.3 * Math.sin((t-0.02)/0.08*Math.PI*0.5);    // P 波
  else if(t < 0.11) v = 0;                          // PR 段
  else if(t < 0.14) v = -0.1;                       // 轻微下降
  else if(t < 0.18) v = -0.1 - 1.0 * (t-0.14)/0.04; // R 峰急升
  else if(t < 0.19) v = -1.1;                       // R 峰顶
  else if(t < 0.21) v = -1.1 + 1.2 * (t-0.19)/0.02; // S 下探
  else if(t < 0.22) v = 0.1;                        // S 底
  else if(t < 0.26) v = 0.1 - 0.4 * (t-0.22)/0.04;  // ST 段
  else if(t < 0.32) v = -0.3;                       // T 波起始
  else if(t < 0.40) v = -0.3 - 0.5 * (t-0.32)/0.08; // T 波上升
  else if(t < 0.44) v = -0.8;                       // T 波顶
  else if(t < 0.50) v = -0.8 + 0.8 * (t-0.44)/0.06; // T 回落
  else v = 0;
  PQRST.push(v);
}

let ekgPhase = 0; // 相位 (0-60)
const EKG_NOISE_MAG = 0.03;
const EKG_MID = 80;
const EKG_AMP = 50;

function drawEKG(bpm, energy){
  const canvas = document.getElementById('ekg-canvas');
  if(!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  // 网格
  ctx.strokeStyle='rgba(0,240,255,0.06)';
  ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=80){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // 推进相位 (根据心率)
  const phaseStep = Math.max(0.3, bpm/60 * 1.5);
  ekgPhase = (ekgPhase + phaseStep) % 60;

  // 记录当前值
  const beatVal = EKG_MID + PQRST[Math.floor(ekgPhase)] * EKG_AMP * (0.8 + energy/100*0.4) + (Math.random()-0.5)*EKG_NOISE_MAG*EKG_AMP;
  ekgData.push(beatVal);
  if(ekgData.length > EKG_POINTS) ekgData.shift();

  // 画波形线
  ctx.beginPath();
  for(let i=0;i<ekgData.length;i++){
    const x = (i/EKG_POINTS)*W;
    const y = ekgData[i];
    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#00f0ff';
  ctx.lineWidth=2;
  ctx.shadowColor='#00f0ff';
  ctx.shadowBlur=8;
  ctx.stroke();
  ctx.shadowBlur=0;

  // 画填充面积
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let i=0;i<ekgData.length;i++){
    const x = (i/EKG_POINTS)*W;
    ctx.lineTo(x, ekgData[i]);
  }
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fillStyle='rgba(0,240,255,0.08)';
  ctx.fill();

  // 发光点 (最新心跳)
  const lastX = W;
  const lastY = ekgData[ekgData.length-1] || EKG_MID;
  ctx.beginPath();
  ctx.arc(lastX-2, lastY, 4, 0, Math.PI*2);
  ctx.fillStyle='#00f0ff';
  ctx.shadowBlur=20;
  ctx.fill();
  ctx.shadowBlur=0;
}

// ── D3 Graph ──
function renderGraph(nodes,edges){
  const svg = document.getElementById('graph-svg');
  const W=740,H=280;
  // Simple force layout simulation
  const pos = {};
  const N = nodes.length;
  const cx=W/2, cy=H/2;
  nodes.forEach((n,i)=>{
    const angle = (i/N)*2*Math.PI - Math.PI/2;
    const r = 100 + (i%3)*20;
    pos[n.name] = {x:cx+r*Math.cos(angle),y:cy+r*Math.sin(angle)};
  });
  // Edges
  let html = '';
  edges.forEach(e=>{
    const s=pos[e.source]||{x:cx,y:cy};
    const t=pos[e.target]||{x:cx+50,y:cy};
    html+=`<line x1="${s.x}" y1="${s.y}" x2="${t.x}" y2="${t.y}" stroke="${SYSTEM_COLORS[e.source]||'var(--border)'}" stroke-width="1.5" opacity="0.6"/>`;
  });
  // Nodes
  nodes.forEach(n=>{
    const p=pos[n.name]||{x:cx+Math.random()*100-50,y:cy+Math.random()*100-50};
    const color=SYSTEM_COLORS[n.name]||'var(--cyan)';
    const r=n.name==='KnowledgeCore'?8:12;
    const label=n.name.replace('System','').replace('Core','');
    html+=`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color}" opacity="0.8" stroke="#000" stroke-width="1"/>`;
    html+=`<text x="${p.x}" y="${p.y+r+12}" text-anchor="middle" fill="var(--text)" font-size="9">${label}</text>`;
  });
  svg.innerHTML = html;
}

// ── Update Functions ──
function updateStatus(data){
  const {energy,heartbeat,growthStage,waste}=data;
  const e=energy||{};
  const hb=heartbeat||{};
  const bpm = hb.heartRate||60;
  document.getElementById('energy-val').textContent = Math.round(e.current??50);
  document.getElementById('energy-val2').textContent = Math.round(e.current??50);
  document.getElementById('energy-bar').style.width = (e.percent??50)+'%';
  document.getElementById('bpm-val').textContent = bpm;
  document.getElementById('bpm-val2').textContent = bpm;
  document.getElementById('bpm-bar').style.width = Math.min(100,(bpm/120)*100)+'%';
  document.getElementById('stage-val').textContent = growthStage||'—';
  document.getElementById('stage-val2').textContent = growthStage||'—';
  const wm = waste||{total:0};
  document.getElementById('waste-val').textContent = wm.total;
  document.getElementById('waste-val2').textContent = wm.total;
  document.getElementById('waste-bar').style.width = wm.total+'%';
  const run = data.isRunning;
  document.getElementById('running-dot').className = run?'dot green':'dot red';
  document.getElementById('running-text').textContent = run?'运行中':'已停止';
  document.getElementById('status-badge').textContent = run?'运行中':'已停止';
  document.getElementById('status-badge').className = 'badge'+(run?'':' off');
  drawEKG(bpm, energy);
}

function updateHormones(hormones){
  if(!hormones||hormones.length===0) return;
  hormones.forEach(h=>{
    const name = h.name||h.hormone||'';
    const level = h.level??0;
    const el = document.getElementById('h-'+name);
    if(el){
      el.textContent = level.toFixed(2);
      // Update bar
      const row = el.closest('.hormone-row');
      if(row){
        const fill = row.querySelector('.bar-fill');
        if(fill){
          fill.style.width = (level*100)+'%';
          fill.style.background = HORMONE_COLORS[name]||'var(--cyan)';
        }
      }
    }
  });
  document.getElementById('hormone-ts').textContent = new Date().toLocaleTimeString();
}

function updateAttention(attData){
  const allocs = attData?.allocations||[];
  const el = document.getElementById('attn-list');
  if(allocs.length===0){
    el.innerHTML = '<span style="color:var(--dim);font-size:11px">等待重平衡...</span>';
    return;
  }
  el.innerHTML = allocs.map(a=>{
    const pct = (a.focus*100).toFixed(1);
    const color = SYSTEM_COLORS[a.system]||'var(--cyan)';
    return `<span class="attn-tag" style="border-color:${color}20;background:${color}15">${a.system.replace('System','')} ${pct}%</span>`;
  }).join('');
}

function updateGraph(depData){
  const nodes = depData?.nodes||[];
  const edges = depData?.edges||[];
  document.getElementById('graph-info').textContent = `系统: ${nodes.length} | 链接: ${edges.length}`;
  renderGraph(nodes,edges);
}

function updateKnowledge(events){
  const el = document.getElementById('kflow-list');
  if(!events||events.length===0){
    el.innerHTML = '<span style="color:var(--dim)">暂无知识流</span>';
    return;
  }
  document.getElementById('kflow-count').textContent = events.length;
  el.innerHTML = events.slice(-15).reverse().map(e=>{
    const type = e.type||'event';
    const src = e.source||'?';
    const tgt = e.target||'';
    const desc = e.description||e.content||'';
    return `<div style="padding:2px 4px;border-left:2px solid ${type==='learned'?'var(--yellow)':'var(--green)'};font-size:10px">
      <span style="color:${type==='learned'?'var(--yellow)':'var(--green)'}">${type}</span>
      <span style="color:var(--dim)">${src}${tgt?' → '+tgt:''}</span>
      <span style="color:var(--text)">${desc.substring(0,60)}</span>
    </div>`;
  }).join('');
}

function addChatMessage(sender,text){
  const el = document.getElementById('chat-msgs');
  const cls = sender==='user'?'user':'nova';
  el.innerHTML += `<div class="msg ${cls}"><div class="sender">◆ ${sender.toUpperCase()}</div>${text}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateTicker(text){
  document.getElementById('ticker-text').textContent = text;
  document.getElementById('ticker-main').textContent = text;
}

// ── Chat ──
document.getElementById('chat-send').addEventListener('click',sendChat);
document.getElementById('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  addChatMessage('user',text);
  input.value='';
  try{
    const resp = await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data = await resp.json();
    if(data.reply) addChatMessage('nova',data.reply);
    else if(data.ok) addChatMessage('system','已收到');
    updateTicker(`🧑 ${text}`);
  }catch(e){addChatMessage('system','发送失败: '+e.message)}
}

// ── Polling Loop ──
async function pollAll(){
  try{
    const [statusRes,bioRes,depRes,attRes,knowRes,horRes] = await Promise.all([
      fetch(API+'/api/status'),fetch(API+'/api/biometrics'),
      fetch(API+'/api/dependencies'),fetch(API+'/api/attention'),
      fetch(API+'/api/knowledge'),fetch(API+'/api/hormones')
    ]);
    const status = await statusRes.json();
    const bio = await bioRes.json();
    const dep = await depRes.json();
    const att = await attRes.json();
    const know = await knowRes.json();
    const hor = await horRes.json();

    updateStatus(status);
    updateHormones(hor);
    updateAttention(att);
    updateGraph(dep);
    updateKnowledge(know);

    const w = status.energy?.energy??50;
    document.getElementById('wisdom-val').textContent = bio.wisdom||0;
    document.getElementById('wisdom-val2').textContent = bio.wisdom||0;

    // Ticker
    const topSys = att.allocations?.slice(0,2).map(a=>a.system.replace('System','')).join(', ')||'—';
    updateTicker(`❤ ${status.heartbeat?.heartRate||60}BPM | 能量 ${w}% | 聚焦: ${topSys} | 阶段: ${status.growthStage||'—'} | ${new Date().toLocaleTimeString()}`);

  }catch(e){
    console.error('Poll error:',e);
    document.getElementById('status-badge').textContent='离线';
    document.getElementById('status-badge').className='badge off';
  }
}

// ── Init ──
window.addEventListener('DOMContentLoaded',()=>{
  pollAll();
  setInterval(pollAll,3000);
  // ── EKG 高速渲染 (6fps) ──
  setInterval(()=>{
    const bpm = parseInt(document.getElementById('bpm-val')?.textContent) || 80;
    const e = parseFloat(document.getElementById('energy-bar')?.style?.width) || 50;
    drawEKG(bpm, e);
  }, 160);
  // Simulate incoming agent messages (in real setup, SSE or polling /api/status for changes)
  setInterval(()=>{
    const msgs = document.getElementById('chat-msgs');
    // Don't spam — only add if last msg is not from nova and not empty
    if(msgs.children.length>1){
      const last = msgs.lastElementChild;
      if(last && last.querySelector('.sender')?.textContent?.includes('NOVA')) return;
    }
  },5000);
});
</script>
